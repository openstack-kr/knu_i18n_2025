# playbooks/knu-translate/run.yaml
- hosts: all
  gather_facts: false

  vars:
    project_dir: "{{ zuul.project.src_dir }}"
    translator_dir: "{{ ansible_user_dir }}/src/opendev.org/openstack/i18n"
    config_file: "{{ translator_dir }}/config.yaml"

  tasks:

    - name: Update config.yaml for CI mode
      lineinfile:
        path: "{{ config_file }}"
        regexp: "^project:"
        line: 'project: "{{ zuul.project.short_name }}"'

    - name: Update branch in config.yaml
      lineinfile:
        path: "{{ config_file }}"
        regexp: "^branch:"
        line: 'branch: "{{ zuul.branch }}"'

    - name: Ensure required python packages installed
      pip:
        requirements: "{{ translator_dir }}/requirements.txt"
        executable: pip3

    - name: Run CI translation pipeline
      command: bash scripts/ci.sh {{ config_file }}
      args:
        chdir: "{{ translator_dir }}"
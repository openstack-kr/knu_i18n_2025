---
# roles/prepare-ai-translation/defaults/main.yaml

# Base directory (ci/)
base_dir: "{{ playbook_dir }}/.."

project_name: "neutron-lib"
project_dir: "{{ base_dir }}/workspace/{{ project_name }}"
scripts_dir: "{{ role_path }}/files"

# AI settings
ai_model: "llama3.2:3b"
worker_count: 4
start_index: 0
end_index: 200
batch_size: 5
target_lang:
  - ru

# Path settings
pot_dir: "{{ base_dir }}/pot"
po_dir: "{{ base_dir }}/po"
glossary_dir: "{{ base_dir }}/glossary"
example_dir: "{{ base_dir }}/po-example"
output_dir: "{{ base_dir }}/data/result"

# File names
pot_file: "neutron_lib.pot"
glossary_po: "glossary.po"
glossary_json: "glossary.json"
example_file: "nova-nova-locale.po"
fixed_json: "fixed_examples.json"

# URL settings
glossary_url: "https://opendev.org/openstack/i18n/raw/commit/129b9de7be12740615d532591792b31566d0972f/glossary/locale/{lang}/LC_MESSAGES/glossary.po"
example_url: "https://opendev.org/openstack/nova/raw/branch/master/nova/locale/{lang}/LC_MESSAGES/nova.po"

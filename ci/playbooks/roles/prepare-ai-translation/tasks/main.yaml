---
- name: Install necessary packages
  package:
    name:
      - gettext
      - python3-pip
      - python3-venv
    state: present
  become: yes
  when: ansible_os_family == 'Debian'

- name: Check if Ollama is installed
  command: which ollama
  register: ollama_check
  changed_when: false
  failed_when: false

- name: Install Ollama
  shell: |
    curl -fsSL https://ollama.com/install.sh | sh
  args:
    executable: /bin/bash
  become: yes
  when: ollama_check.rc != 0
  register: ollama_install
  until: ollama_install.rc == 0
  retries: 3
  delay: 15

- name: Ensure Ollama service is started
  systemd:
    name: ollama
    state: started
    enabled: yes
  become: yes

- name: Wait for Ollama service to be ready
  wait_for:
    port: 11434
    delay: 2
    timeout: 60

- name: Ensure scripts directory exists
  file:
    path: "{{ scripts_dir }}"
    state: directory
    mode: '0755'

- name: Ensure translation directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ai_config.paths.pot_dir }}"
    - "{{ ai_config.paths.po_dir }}"
    - "{{ ai_config.paths.glossary_dir }}"
    - "{{ ai_config.paths.example_dir }}"
    - "{{ ai_config.paths.output_dir }}"

- name: Pull AI model
  command: "ollama pull {{ ai_config.ai.model }}"
  changed_when: false
  async: 3600
  poll: 30

- name: Create Python virtual environment
  command: "python3 -m venv {{ venv_dir }}"
  args:
    creates: "{{ venv_dir }}/bin/activate"

- name: Check if project requirements.txt exists
  stat:
    path: "{{ ai_config.project.dir }}/requirements.txt"
  register: requirements_file

- name: Install project python requirements
  pip:
    requirements: "{{ ai_config.project.dir }}/requirements.txt"
    virtualenv: "{{ venv_dir }}"
  when: requirements_file.stat.exists

- name: Install AI translation dependencies
  pip:
    name:
      - polib
      - ollama
      - tqdm
      - Babel
      - requests
      - pyyaml
    virtualenv: "{{ venv_dir }}"

- name: Generate runtime config file
  copy:
    content: "{{ ai_config | to_nice_yaml(indent=2) }}"
    dest: "{{ config_file }}"

- name: Get HEAD commit hash
  command: git rev-parse HEAD
  args:
    chdir: "{{ ai_config.project.dir }}"
  register: head_commit
  changed_when: false

- name: Get HEAD~1 commit hash
  command: git rev-parse HEAD~1
  args:
    chdir: "{{ ai_config.project.dir }}"
  register: base_commit
  changed_when: false

- name: Extract POT from HEAD and HEAD~1
  block:
    - name: Checkout HEAD
      command: git checkout -f {{ head_commit.stdout }}
      args:
        chdir: "{{ ai_config.project.dir }}"
      changed_when: false

    - name: Extract POT from HEAD
      command:
        argv:
          - "{{ venv_dir }}/bin/python3"
          - "{{ scripts_dir }}/extract_pot.py"
          - "--config"
          - "{{ config_file }}"
          - "--output"
          - "{{ ai_config.paths.pot_dir }}/current_{{ ai_config.files.pot_file }}"
      args:
        chdir: "{{ base_dir }}"
      environment:
        PYTHONPATH: "{{ scripts_dir }}"

    - name: Checkout HEAD~1
      command: git checkout -f {{ base_commit.stdout }}
      args:
        chdir: "{{ ai_config.project.dir }}"
      changed_when: false

    - name: Extract POT from HEAD~1
      command:
        argv:
          - "{{ venv_dir }}/bin/python3"
          - "{{ scripts_dir }}/extract_pot.py"
          - "--config"
          - "{{ config_file }}"
          - "--output"
          - "{{ ai_config.paths.pot_dir }}/previous_{{ ai_config.files.pot_file }}"
      args:
        chdir: "{{ base_dir }}"
      environment:
        PYTHONPATH: "{{ scripts_dir }}"

  always:
    - name: Restore HEAD
      command: git checkout -f {{ head_commit.stdout }}
      args:
        chdir: "{{ ai_config.project.dir }}"
      changed_when: false

- name: Compare POT files and extract new msgid entries
  command:
    argv:
      - "{{ venv_dir }}/bin/python3"
      - "{{ scripts_dir }}/commit_diff.py"
      - "--config"
      - "{{ config_file }}"
      - "--new-pot"
      - "{{ ai_config.paths.pot_dir }}/current_{{ ai_config.files.pot_file }}"
      - "--old-pot"
      - "{{ ai_config.paths.pot_dir }}/previous_{{ ai_config.files.pot_file }}"
  args:
    chdir: "{{ base_dir }}"
  environment:
    PYTHONPATH: "{{ scripts_dir }}"

- name: Count new entries in diff POT
  command:
    argv:
      - grep
      - -c
      - '^msgid "[^"]'
      - "{{ ai_config.paths.pot_dir }}/{{ ai_config.files.pot_file }}"
  register: new_entry_count
  changed_when: false
  failed_when: new_entry_count.rc not in [0, 1]
---
- name: Install necessary packages
  package:
    name:
      - gettext
      - python3-pip
      - python3-venv
    state: present
  become: yes
  when: ansible_os_family == 'Debian'

- name: Check if Ollama is installed
  shell: which ollama
  register: ollama_check
  changed_when: false
  failed_when: false

- name: Install Ollama
  shell: |
    curl -fsSL https://ollama.com/install.sh | sh
  args:
    executable: /bin/bash
  become: yes
  when: ollama_check.rc != 0
  register: ollama_install
  until: ollama_install.rc == 0
  retries: 3
  delay: 15

- name: Ensure scripts directory exists
  file:
    path: "{{ scripts_dir }}"
    state: directory
    mode: '0755'

- name: Ensure translation directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ai_config.paths.pot_dir }}"
    - "{{ ai_config.paths.po_dir }}"
    - "{{ ai_config.paths.glossary_dir }}"
    - "{{ ai_config.paths.example_dir }}"
    - "{{ ai_config.paths.output_dir }}"

- name: Pull AI model
  command: "ollama pull {{ ai_config.ai.model }}"
  register: pull_result
  until: pull_result.rc == 0
  retries: 5
  delay: 10

- name: Create Python virtual environment
  command: "python3 -m venv {{ venv_dir }}"
  args:
    creates: "{{ venv_dir }}/bin/activate"

- name: Check if project requirements.txt exists
  stat:
    path: "{{ ai_config.project.dir }}/requirements.txt"
  register: requirements_file

- name: Install project python requirements
  pip:
    requirements: "{{ ai_config.project.dir }}/requirements.txt"
    virtualenv: "{{ venv_dir }}"
  when: requirements_file.stat.exists

- name: Install AI translation dependencies
  pip:
    name:
      - polib
      - ollama
      - tqdm
      - Babel
      - requests
      - pyyaml
    virtualenv: "{{ venv_dir }}"

- name: Generate runtime config file
  copy:
    content: "{{ ai_config | to_nice_yaml(indent=2) }}"
    dest: "{{ config_file }}"
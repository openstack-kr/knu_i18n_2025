# -----------------------------
#  Required
# -----------------------------
# Set target_file to translate (must be placed under ./data/target/{lang})
target_file: "test.pot"

# Please choose exactly ONE language for local translation.
languages: "ko_KR"

# -----------------------------
#  Option
# -----------------------------
# You can tune these arguments for performance / partial translation:
#   models  : 비교할 모델 목록 (여러 개 지정 시 순서대로 번역 후 pairwise 비교)
#   model   : 단일 모델 (models가 없을 때 fallback)
#   --mode  : Choose your LLM mode[`ollama` (default, for open src LLM), `gpt`, `claude`, `gemini`, `openwebui`]
#   --workers   : number of parallel threads (default: 1)
#   --start/end : entry index range to translate (default: 0 ~ all)
#   --batch-size: entries per LLM call (default: 5)
llm:
  mode: "openwebui"
  models:
    - "llama3.2:3b"
    - "qwen2.5:3b"
    #- "gemma3:4b"
  judge_model: "qwen2.5:7b"   # Arena 판정에 사용할 모델
  workers: 1
  start: 0
  end: -1
  batch_size: 5

# Example: normally you don't need to edit this
examples:
  example_url: "https://opendev.org/openstack/nova/raw/branch/master/nova/locale/{lang}/LC_MESSAGES/nova.po"
  example_file: "nova-nova-locale.po"